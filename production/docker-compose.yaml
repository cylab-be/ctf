#
# cylab/ctf
# https://gitlab.cylab.be/cylab/ctf
#

services:
  web:
    image: cylab/ctf
    container_name: web
    depends_on:
      - redis
      - mysql
    ports:
      - 80
    volumes:
      - web:/var/www/html/storage
    env_file: env.app
    restart: "unless-stopped"

  queue:
    image: cylab/ctf
    container_name: queue
    depends_on:
      - web
    volumes:
      - web:/var/www/html/storage
    entrypoint: php /var/www/html/artisan queue:work --verbose --tries=3 --timeout=60
    env_file: stack.env
    restart: "unless-stopped"

  scheduler:
    image: cylab/ctf
    container_name: scheduler
    depends_on:
      - web
    volumes:
      - web:/var/www/html/storage
    entrypoint: sh -c "while true; do php /var/www/html/artisan schedule:run --verbose & sleep 60; done"
    env_file: stack.env
    restart: "unless-stopped"

  redis:
    image: redis:4-alpine
    container_name: redis
    volumes:
      - redis:/data
    restart: "unless-stopped"

  mysql:
    image: mysql:5.7
    container_name: mysql
    volumes:
      - mysql:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
    restart: "unless-stopped"


volumes:
  web:
  mysql:
  redis: