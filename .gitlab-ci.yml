stages:
  - test
  - release
  - deploy
  
## Cache composer packages between all jobs and all branches
## of this project...
cache:
  key: one-key-to-rull-them-all
  paths:
    - composer-cache/

include:
  - component: gitlab.cylab.be/components/generic/gitleaks@1.2.0
    inputs:
      job_name: gitleaks
      stage: test
      branch: master
  - component: gitlab.cylab.be/components/generic/release@1.2.0
    inputs:
      stage: release
  - component: gitlab.cylab.be/components/docker/build-and-push@1.4.2
    inputs:
      stage: release
      docker_image: cylab/ctf:$CI_COMMIT_TAG
      docker_image2: cylab/ctf:latest
      docker_username: $DOCKER_USERNAME
      docker_password: $DOCKER_PASSWORD
  - component: gitlab.cylab.be/components/generic/deploy@1.2.0
    inputs:
      job_name: deploy
      stage: deploy
      branch: master
      url: $DEPLOY_HOOK


# Test with PHP7.4
test:php83:
  image: cylab/php:8.3
  stage: test
  before_script:
    - cp env.gitlab-ci .env
    - touch storage/app/db.sqlite
    - COMPOSER_CACHE_DIR=composer-cache composer install
    - php artisan key:generate
    - php artisan migrate
  script:
    - vendor/bin/phpunit --coverage-text --colors=never --coverage-html build/coverage
    - vendor/bin/phpcs
    - vendor/bin/phpstan --memory-limit=512m
  artifacts:
    paths:
    - build/
    expire_in: 1 month

