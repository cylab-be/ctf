stages:
  - test
  - release
  - deploy

## Cache composer packages between all jobs and all branches
## of this project...
cache:
  key: one-key-to-rull-them-all
  paths:
    - composer-cache/

# Test with PHP7.4
test:php74:
  image: cylab/php74
  stage: test
  before_script:
    - cp env.gitlab-ci .env
    - touch storage/app/db.sqlite
    - COMPOSER_CACHE_DIR=composer-cache composer install
    - php artisan key:generate
    - php artisan migrate
  script:
    - vendor/bin/phpunit --coverage-text --colors=never --coverage-html build/coverage
    - vendor/bin/phpcs
    - vendor/bin/phpstan --memory-limit=512m
    - vendor/bin/unused_scanner unused-scanner.php
  artifacts:
    paths:
    - build/
    expire_in: 1 month

build:
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  stage: release
  tags:
    - dind
  script:
    - docker build -t cylab/ctf .


build:tagged:
  only:
    - tags
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  stage: release
  tags:
    - dind
  script:
    - docker build -t cylab/ctf:$CI_COMMIT_TAG .
    - docker tag cylab/ctf:$CI_COMMIT_TAG cylab/ctf:latest
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
    - docker push cylab/ctf:$CI_COMMIT_TAG
    - docker push cylab/ctf:latest

#
# create and upload docker-compose.yml
# 
publish:
  only:
    - tags
  stage: release
  image: alpine
  artifacts:
    paths:
      - docker-compose.yml
  script:
    - apk add curl gettext zip
    # use template to create the release docker-compose
    - envsubst < docker-compose.tmpl > docker-compose.yml
    # upload to artifacts.cylab.be
    - "curl https://artifacts.cylab.be/api/ctf/$CI_COMMIT_TAG/docker-compose.yml --request POST --header \"Authorization: Bearer $UPLOAD_TOKEN\" -F \"file=@./docker-compose.yml\""
    - "curl https://artifacts.cylab.be/api/ctf/latest/docker-compose.yml --request POST --header \"Authorization: Bearer $UPLOAD_TOKEN\" -F \"file=@./docker-compose.yml\""


deploy:
  only:
    - tags
  image: cylab/php74
  stage: deploy
  environment:
    name: ctf.cylab.be
    url: https://ctf.cylab.be
  script:
    # import ssh private key
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    # in cylab/php74, envoy is already installed...
    - ~/.composer/vendor/bin/envoy run deploy


