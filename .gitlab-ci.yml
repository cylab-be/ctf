stages:
  - test
  - release
  - deploy

## Cache composer packages between all jobs and all branches
## of this project...
cache:
  key: one-key-to-rull-them-all
  paths:
    - composer-cache/

# Test with PHP7.4
test:php74:
  image: cylab/php74
  stage: test
  before_script:
    - cp env.gitlab-ci .env
    - touch storage/app/db.sqlite
    - COMPOSER_CACHE_DIR=composer-cache composer install
    - php artisan key:generate
    - php artisan migrate
  script:
    - vendor/bin/phpunit --coverage-text --colors=never --coverage-html build/coverage
    - vendor/bin/phpcs
    - vendor/bin/phpstan --memory-limit=512m
    - vendor/bin/unused_scanner unused-scanner.php
  artifacts:
    paths:
    - build/
    expire_in: 1 month

build:
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  stage: release
  tags:
    - dind
  script:
    - docker build -t cylab/ctf .


build:tagged:
  only:
    - tags
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  stage: release
  tags:
    - dind
  script:
    - docker build -t cylab/ctf:$CI_COMMIT_TAG .
    - docker tag cylab/ctf:$CI_COMMIT_TAG cylab/ctf:latest
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
    - docker push cylab/ctf:$CI_COMMIT_TAG
    - docker push cylab/ctf:latest

deploy:
  stage: deploy
  only:
    # only deploy when we push on the master branch
    - master
  image: alpine
  before_script:
    # install envsubst and ssh-add
    - apk add curl
  script:
    - curl -X POST $DEPLOY_HOOK


